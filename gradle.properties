org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official
# :core (Kotlin JVM plugin) and :app (Android Gradle Plugin with its built-in Kotlin) each load the
# Kotlin plugin. Putting it in the root project instead breaks the Android plugin (tried
# 2026-10-26: "Could not generate a decorated class for type KotlinAndroidTarget"), and the root
# must not apply Android plugins so that -PcoreOnly works. The two copies do not share state.
kotlin.pluginLoadedInMultipleProjects.ignore=true
